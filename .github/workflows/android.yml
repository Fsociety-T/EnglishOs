name: Build Android APK

# Manual only. The APK now carries the website inside it, so unlike the Trusted
# Web Activity this replaced, a push to `main` does NOT update an installed
# app - every UI change needs a new build and a reinstall. Supabase data is
# still live either way.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

# `write` so the build can publish its own release. Nothing else here needs it.
permissions:
  contents: write

# The fingerprint of the release keystore. Not a secret - it is derived from the
# certificate every installed copy already carries. Asserted after the build so
# an unsigned or wrongly signed APK cannot reach a release, which would install
# once and then refuse every later update.
env:
  EXPECTED_SHA256: 4A:8D:97:3C:4F:13:42:AD:C1:47:62:DF:54:A4:17:8D:52:BF:99:A4:CC:FA:4D:9B:70:49:0F:59:A7:C5:2B:26

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        id: version
        run: |
          node -e '
            const asked = process.env.VERSION_NAME || "1.0.0";
            // The version name becomes a git tag, so it is checked here rather
            // than after a build has already been paid for.
            if (!/^[0-9A-Za-z._-]+$/.test(asked)) {
              throw new Error(`Version name "${asked}" must be letters, digits, dot, dash or underscore.`);
            }
            const code = Number(process.env.GITHUB_RUN_NUMBER);
            require("fs").appendFileSync(
              process.env.GITHUB_OUTPUT,
              `name=${asked}\ncode=${code}\n`,
            );
            console.log(`version ${asked} (${code})`);
          '
        env:
          VERSION_NAME: ${{ inputs.version_name }}

      # CAPACITOR=1 switches the base path to / and drops the service worker.
      # Without it the app looks for /EnglishOs/assets inside the APK, where
      # nothing lives, and shows a blank screen.
      - name: Build the web app
        run: CAPACITOR=1 npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_PROVIDER: ${{ vars.VITE_AI_PROVIDER || secrets.VITE_AI_PROVIDER || 'mock' }}

      # These are baked into the bundle, so a build without them ships an app
      # permanently stuck in offline demo mode with no way to sign in. Failing
      # here is far kinder than shipping that.
      - name: Check the app was built against Supabase
        run: |
          if ! grep -rqs 'supabase\.co' dist/assets; then
            echo "::error::No Supabase URL in the bundle. Set the VITE_SUPABASE_URL and"
            echo "::error::VITE_SUPABASE_ANON_KEY repository secrets, or this APK cannot sign in."
            exit 1
          fi
          echo "Supabase credentials are in the bundle."

      - name: Copy the web app into the Android project
        run: npx cap sync android

      # Deliberately after the sync: a run with no secrets still exercises the
      # whole toolchain, which is where breakage lives, instead of stopping at
      # the first missing value.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Everything before"
            echo "::error::this step succeeded, so only the secrets are outstanding."
            echo "::error::See docs/ANDROID.md."
            exit 1
          fi

          # Strip whitespace first: a value pasted through a browser can pick up
          # newlines, and base64 that is still a valid multiple of 4 decodes
          # happily into a truncated file.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/android.keystore"

          size=$(stat -c%s "${RUNNER_TEMP}/android.keystore")
          echo "decoded keystore: ${size} bytes (expected 2718)"

          # Prove the keystore opens before spending a Gradle build on it.
          if ! keytool -list -keystore "${RUNNER_TEMP}/android.keystore" -storepass "$STOREPASS" >/dev/null 2>&1; then
            echo "::error::The keystore did not open (decoded to ${size} bytes)."
            echo "::error::Two possible causes:"
            echo "::error::1. ANDROID_KEYSTORE_BASE64 is truncated. It is one very long"
            echo "::error::   line and a partial copy still decodes into a broken file."
            echo "::error::   Re-copy the WHOLE value from android.keystore.base64.txt."
            echo "::error::2. ANDROID_KEYSTORE_PASSWORD does not match the keystore."
            exit 1
          fi
          echo "keystore opened successfully"

      - name: Build and sign
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: englishos
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK is signed with the right key
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "using ${apksigner}"

          got=$("$apksigner" verify --print-certs "$apk" \
            | grep -m1 -i 'SHA-256 digest:' \
            | sed 's/.*: *//' \
            | tr -d ' ' | tr 'a-f' 'A-F')
          want=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':')

          echo "signed by: ${got}"
          if [ "$got" != "$want" ]; then
            echo "::error::This APK is signed by a different key than the one in docs/ANDROID.md."
            echo "::error::expected ${want}"
            echo "::error::Android will refuse to install it over the app already on the phone."
            echo "::error::If you replaced the keystore on purpose, update EXPECTED_SHA256 in this workflow."
            exit 1
          fi
          echo "signature matches the expected key"

      - name: Name the APK after the app
        id: apk
        run: |
          name="EnglishOS-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "size: $(( $(stat -c%s "$name") / 1024 / 1024 )) MB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: englishos-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # An artifact expires after 30 days and can only be downloaded by someone
      # signed in to GitHub, from a zip. A release is a permanent, plain link
      # you can open on the phone itself - which is the only comfortable way to
      # install a sideloaded APK.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          {
            printf 'Download **%s** below and open it on the phone.\n' "$APK"
            printf 'Android will ask you to allow installing from unknown sources - expected for an app that did not come from the Play Store.\n\n'
            printf -- '- Version `%s`, build `%s`\n' "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- The website is built into this APK. A change pushed to `main` reaches the app only in the next build, so install a new APK when you want new features.\n'
          } > release-notes.md

          # Re-running with a version name that has already shipped replaces
          # that release rather than failing, so a bad build can be corrected
          # without inventing a version number nobody asked for.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - replacing its APK."
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "EnglishOS ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/android.keystore"
