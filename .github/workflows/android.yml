name: Build Android APK

# Manual only. The APK wraps the live site rather than bundling it, so it does
# not need rebuilding when the site changes — only when the icon, name, or
# start URL in twa-manifest.json does.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown to users (e.g. 1.0.1)'
        required: false
        default: '1.0.0'

# `write` so the build can publish its own release. Nothing else here needs it.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bubblewrap drives Gradle, which needs a JDK and the Android SDK. Without
      # both on disk it tries to download them interactively and hangs the run.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's JDK and SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"

      # Android refuses to install an update whose versionCode is not higher
      # than the installed one, so tie it to the run number.
      - name: Stamp version
        id: version
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            const asked = process.env.VERSION_NAME;
            // The version name becomes a git tag, so keep it to characters a
            // tag can hold. A space or a slash here would fail much later,
            // after the build has already been paid for.
            if (asked && !/^[0-9A-Za-z._-]+$/.test(asked)) {
              throw new Error(`Version name "${asked}" must be letters, digits, dot, dash or underscore.`);
            }
            m.appVersionName = asked || m.appVersionName;
            m.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `name=${m.appVersionName}\ncode=${m.appVersionCode}\n`,
            );
            console.log(`version ${m.appVersionName} (${m.appVersionCode})`);
          '
        env:
          VERSION_NAME: ${{ inputs.version_name }}

      - name: Generate the Android project
        run: bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade

      # Deliberately after the project generation: a run with no secrets still
      # exercises the toolchain and Bubblewrap, which is where breakage lives,
      # instead of stopping at the first missing value.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Everything before"
            echo "::error::this step succeeded, so only the secrets are outstanding."
            echo "::error::See docs/ANDROID.md."
            exit 1
          fi

          # Strip whitespace first: a value pasted through a browser can pick up
          # newlines, and base64 that is still a valid multiple of 4 decodes
          # happily into a truncated file.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android.keystore

          size=$(stat -c%s android.keystore)
          echo "decoded keystore: ${size} bytes"

          # Prove the keystore opens before spending a Gradle build on it.
          # Without this the failure surfaces ~50s later as a Java stack trace
          # from apksigner, which says nothing about the actual cause.
          if ! keytool -list -keystore android.keystore -storepass "$STOREPASS" >/dev/null 2>&1; then
            echo "::error::The keystore did not open (decoded to ${size} bytes)."
            echo "::error::Two possible causes:"
            echo "::error::1. ANDROID_KEYSTORE_BASE64 is truncated. It is one very long"
            echo "::error::   line and a partial copy still decodes into a broken file."
            echo "::error::   Re-copy the WHOLE value from android.keystore.base64.txt."
            echo "::error::2. ANDROID_KEYSTORE_PASSWORD does not match the keystore."
            exit 1
          fi
          echo "keystore opened successfully"

      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Show the signing fingerprint
        run: |
          echo "This SHA-256 must match .well-known/assetlinks.json,"
          echo "or the app opens with a browser address bar."
          keytool -list -v -keystore android.keystore -alias englishos \
            -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -A1 'SHA256:' || true
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: englishos-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      # An artifact expires after 30 days and can only be downloaded by someone
      # signed in to GitHub, from a zip. A release is a permanent, plain link
      # you can open on the phone itself - which is the only comfortable way to
      # install a sideloaded APK.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # Name the download after the app. "app-release-signed.apk" says
          # nothing once it is sitting in a phone's Downloads folder.
          cp app-release-signed.apk "EnglishOS-${VERSION_NAME}.apk"

          {
            printf 'Download **EnglishOS-%s.apk** below and open it on the phone.\n' "$VERSION_NAME"
            printf 'Android will ask you to allow installing from unknown sources - expected for an app that did not come from the Play Store.\n\n'
            printf -- '- Version `%s`, build `%s`\n' "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- The app opens the live site, so day-to-day updates arrive on their own. Reinstall only when the icon, name or start URL changes.\n'
          } > release-notes.md

          # Re-running with a version name that has already shipped replaces
          # that release rather than failing, so a bad build can be corrected
          # without inventing a version number nobody asked for.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - replacing its APK."
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "EnglishOS-${VERSION_NAME}.apk" --clobber
          else
            gh release create "$TAG" "EnglishOS-${VERSION_NAME}.apk" \
              --title "EnglishOS ${VERSION_NAME}" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f android.keystore
